name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Assemble debug APK
        run: |
          set +e
          gradle --no-daemon --console=plain assembleDebug > build-log.txt 2>&1
          code=$?
          echo "gradle exit code: $code"
          grep -E "^e: |error: |FAILURE:|What went wrong" build-log.txt | head -n 10 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 40 build-log.txt
          exit $code

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f build-log.txt
          git commit -m "ci: build log [skip ci]" || true
          git push || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: courierradar-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
