name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Assemble debug APK
        run: |
          set +e
          gradle --no-daemon --console=plain assembleDebug > build-log.txt 2>&1
          code=$?
          echo "gradle exit code: $code"
          grep -E "^e: |error: |FAILURE:|What went wrong" build-log.txt | head -n 10 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 40 build-log.txt
          exit $code

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f build-log.txt
          git commit -m "ci: build log [skip ci]" || true
          git push || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: courierradar-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Inspect APK
        if: success()
        id: inspect
        run: |
          set +e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          ls -l "$apk"
          bt="$ANDROID_HOME/build-tools/34.0.0"
          : > badging.txt
          for tool in aapt aapt2; do
            chmod +x "$bt/$tool" 2>/dev/null
            if [ -x "$bt/$tool" ] && [ ! -s badging.txt ]; then
              "$bt/$tool" dump badging "$apk" > badging-full.txt 2>/dev/null
              grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label:)" badging-full.txt > badging.txt 2>/dev/null
            fi
          done
          if [ ! -s badging.txt ]; then
            echo "(aapt недоступен в образе)" > badging.txt
          fi
          head -n 40 badging.txt
          unzip -l "$apk" | grep -E "classes.*dex|AndroidManifest.xml" || true
          exit 0

      - name: Publish release with APK
        if: success() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="${{ steps.inspect.outputs.apk }}"
          tag="v1.0.${{ github.run_number }}"
          size=$(du -h "$apk" | cut -f1)
          {
            echo "## КурьерРадар"
            echo ""
            echo "Плавающий виджет с расчётом чистой суммы заказа поверх Яндекс Про."
            echo ""
            echo "- APK: \`app-debug.apk\` ($size), подписан debug-ключом — устанавливается на телефон как обычное приложение."
            echo "- Коммит: ${{ github.sha }}"
            echo ""
            echo "### Как установить"
            echo "1. Скачай \`app-debug.apk\` с этого релиза (открывай ссылку сразу с телефона)."
            echo "2. Разреши установку из неизвестных источников."
            echo "3. Выдай разрешения: «Поверх других приложений» + «Спец. возможности» (и по желанию «Доступ к данным об использовании»)."
            echo "4. Включи тумблер «Радар включён» и открой Яндекс Про."
            echo ""
            echo "### Содержимое APK"
            echo '```'
            cat badging.txt || true
            echo '```'
          } > notes.md
          gh release create "$tag" "$apk" \
            --title "КурьерРадар $tag" \
            --notes-file notes.md \
            --latest
